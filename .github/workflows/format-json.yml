name: Format JSON

on:
  pull_request:
  push:
    paths-ignore: ['**/packages.lock.json']
    paths:
      - .github/workflows/format-json.yml
      - '**/*.json'

concurrency: Format-${{ github.ref }}
permissions:
  contents: write

jobs:
  format-json:
    uses: winstxnhdw/actions/.github/workflows/format-biome.yml@10339f0c31654e18c00d8c7256351ba78bcb2ef7 # main
