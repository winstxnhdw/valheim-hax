name: Format JSON

on:
  pull_request:
  push:
    paths-ignore: ['**/packages.lock.json']
    paths:
      - .github/workflows/format-json.yml
      - '**/*.json'

concurrency: Format-${{ github.ref }}
permissions:
  contents: write

jobs:
  format-json:
    uses: winstxnhdw/actions/.github/workflows/format-biome.yml@9a8a1548bdf2fae3fe2f70426f0af4dfef3c38b4 # main
