name: Format JSON

on:
  pull_request:
  push:
    paths-ignore: ['**/packages.lock.json']
    paths:
      - .github/workflows/format-json.yml
      - '**/*.json'

concurrency: Format-${{ github.ref }}
permissions:
  contents: write

jobs:
  format-json:
    uses: winstxnhdw/actions/.github/workflows/format-biome.yml@616389d9e449f2a129b80276e49f084812180f4a # main
