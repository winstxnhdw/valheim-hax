name: Format JSON

on:
  pull_request:
  push:
    paths-ignore: ['**/packages.lock.json']
    paths:
      - .github/workflows/format-json.yml
      - '**/*.json'

concurrency: Format-${{ github.ref }}
permissions:
  contents: write

jobs:
  format-json:
    uses: winstxnhdw/actions/.github/workflows/format-biome.yml@0832d473774c1447617374fce8cf68e75c50dd7f # main
